name: Scorecard

# OpenSSF Scorecard checks the repository's security practices and publishes
# the results, shown by the badge in the README. It needs a public
# repository, or GitHub Advanced Security on a private one.
on:
  push:
    branches: [main]
  schedule:
    # Weekly, on Monday at 04:37 UTC.
    - cron: "37 4 * * 1"
  branch_protection_rule:
  workflow_dispatch:

# Publishing the results requires no write permission at the workflow level;
# only the job below gets the ones it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Job permissions replace the workflow's, so the reads are listed again.
    permissions:
      contents: read
      actions: read
      # To upload the results to code scanning.
      security-events: write
      # To publish the results.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
